# Dependency updates.
#
# Everything this project depends on is build-time only — there are no runtime
# dependencies to ship — so the npm updates are grouped into a single weekly
# pull request rather than one per package. CI builds and tests each one, which
# is the check that matters for a toolchain bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      toolchain:
        patterns:
          - "*"
    ignore:
      # Vite 7 and later require Node 20.19+, and this project supports Node 18
      # — a floor the CI matrix enforces and the README states. A major Vite
      # bump is therefore a decision about the supported Node range, not a
      # routine update, so it should not arrive as an automatic pull request.
      # Revisit this together with the Node floor.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]

  # Keep the actions used by the workflow below current, including security
  # fixes to the actions themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
